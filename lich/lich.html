<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>10C7 AIO - Thời Khóa Biểu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/hub.css?v=3.3.2">
  <link rel="stylesheet" href="../style/lich.css?v=3.3.2">
</head>
<body>

  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <a href="../index.html" class="back-btn" title="Về trang chủ">←</a>
        <div class="header-titles">
          <div class="header-title-row">
            <span class="header-icon">📅</span>
            <span class="header-title-text">Thời Khóa Biểu</span>
          </div>
          <p>Lịch học & phòng học chi tiết tuần</p>
        </div>
      </div>
      <div class="header-right">
        <!-- Theme toggle injected by hub.js -->
        <button class="user-badge-btn" onclick="go('index.html')">
          <span id="userNameDisplay">Học sinh</span>
        </button>
      </div>
    </div>
  </header>

  <main class="lich-page-container">

    <!-- Top Action & Info Bar -->
    <section class="lich-top-bar">
      <div class="lich-meta-info">
        <h3 id="currentWeekTitle" style="font-weight: 800; font-size: 1.15rem;">📅 Thời Khóa Biểu Tuần</h3>
        <p id="currentWeekDateRange" style="color: var(--text-sub); font-size: 0.85rem;">Từ Thứ 2 đến Thứ 7</p>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="c7-btn c7-btn-secondary" id="btnExportTimetable" onclick="exportTimetableJson()">
          📥 Xuất Lịch
        </button>
        <button class="c7-btn c7-btn-primary" id="btnOpenAddClass" onclick="openAddClassModal()">
          ➕ Thêm Tiết Học
        </button>
      </div>
    </section>

    <!-- Timetable Grid -->
    <section class="timetable-card-container">
      <div class="timetable-grid" id="timetableGrid">
        <!-- Rendered by lich.js -->
      </div>
    </section>

  </main>

  <!-- Modal: Add / Edit Class Session -->
  <div class="c7-dialog-overlay" id="classModalOverlay" style="display: none;">
    <div class="c7-dialog-box" style="max-width: 520px; text-align: left;">
      <h3 id="classModalTitle" style="font-size: 1.25rem; font-weight: 800; margin-bottom: 14px;">➕ Thêm Tiết Học Mới</h3>
      
      <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Thứ trong tuần</label>
            <select id="selectClassDay" class="form-control-custom">
              <option value="2">Thứ 2</option>
              <option value="3">Thứ 3</option>
              <option value="4">Thứ 4</option>
              <option value="5">Thứ 5</option>
              <option value="6">Thứ 6</option>
              <option value="7">Thứ 7</option>
            </select>
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Tiết học</label>
            <select id="selectClassPeriod" class="form-control-custom">
              <option value="1">Tiết 1 (07:15 - 08:00)</option>
              <option value="2">Tiết 2 (08:05 - 08:50)</option>
              <option value="3">Tiết 3 (09:05 - 09:50)</option>
              <option value="4">Tiết 4 (09:55 - 10:40)</option>
              <option value="5">Tiết 5 (10:45 - 11:30)</option>
            </select>
          </div>
        </div>

        <div>
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Môn học (*)</label>
          <input type="text" id="inputClassSubject" class="form-control-custom" placeholder="vd: Toán, Ngữ Văn, Tiếng Anh...">
        </div>

        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Giáo viên bộ môn</label>
            <input type="text" id="inputClassTeacher" class="form-control-custom" placeholder="vd: Cô Nguyễn...">
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Phòng học</label>
            <input type="text" id="inputClassRoom" class="form-control-custom" placeholder="vd: P.302">
          </div>
        </div>

        <div>
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Ghi chú thêm</label>
          <input type="text" id="inputClassNote" class="form-control-custom" placeholder="vd: Mang theo SGK tập 2...">
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; gap: 10px;">
        <button class="c7-btn c7-btn-danger" id="btnDeleteClassTrigger" style="display: none;" onclick="deleteClassSession()">Xóa tiết</button>
        <div style="display: flex; gap: 8px; margin-left: auto;">
          <button class="c7-btn c7-btn-secondary" onclick="closeClassModal()">Hủy bỏ</button>
          <button class="c7-btn c7-btn-primary" onclick="submitClassSession()">Lưu Lịch</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Lớp 10C7. C7AIO Hub.</p>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Core Scripts -->
  <script src="../script/firebase-config.js?v=3.3.2"></script>
  <script src="../script/firebase-utils.js?v=3.3.2"></script>
  <script src="../script/students-list.js?v=3.3.2"></script>
  <script src="../script/hub.js?v=3.3.2"></script>
  <script src="../script/console.js?v=3.3.2"></script>
  <script src="../script/lich.js?v=3.3.2"></script>
</body>
</html>
