<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>11C7 AIO - Quản Lý Hồ Sơ Học Sinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/hub.css?v=3.3.4">
  <link rel="stylesheet" href="../style/hs.css?v=3.3.4">
</head>
<body>

  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <a href="../index.html" class="back-btn" title="Về trang chủ">←</a>
        <div class="header-titles">
          <div class="header-title-row">
            <span class="header-icon">👨‍🎓</span>
            <span class="header-title-text">Hồ Sơ Học Sinh</span>
          </div>
          <p>Danh bạ & thông tin chi tiết thành viên lớp 11C7 (Năm học 2026-2027)</p>
        </div>
      </div>
      <div class="header-right">
        <!-- Theme toggle injected by hub.js -->
        <button class="user-badge-btn" onclick="go('index.html')">
          <span id="userNameDisplay">Học sinh</span>
        </button>
      </div>
    </div>
  </header>

  <main class="hs-page-container">

    <!-- Top Action & Search Bar -->
    <section class="hs-top-bar">
      <div class="c7-search-box">
        <span class="c7-search-icon">🔍</span>
        <input type="text" id="hsSearchInput" class="c7-search-input" placeholder="Tìm kiếm theo tên, SĐT, Email, Lớp cũ..." oninput="handleStudentSearch(this.value)">
      </div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="c7-btn c7-btn-secondary" onclick="exportStudentsCsv()">
          📤 Xuất CSV
        </button>
        <button class="c7-btn c7-btn-secondary" onclick="triggerImportCsv()">
          📥 Nhập CSV
        </button>
        <input type="file" id="csvFileInput" accept=".csv, .json" style="display: none;" onchange="handleCsvFile(event)">
        <button class="c7-btn c7-btn-primary" onclick="openAddStudentModal()">
          <span>+</span> Thêm Học Sinh
        </button>
      </div>
    </section>

    <!-- Students Table Card -->
    <section class="hs-table-card">
      <table class="c7-table">
        <thead>
          <tr>
            <th style="width: 40px; text-align: center;">STT</th>
            <th style="min-width: 170px;">Họ và Tên</th>
            <th style="min-width: 110px;">Chức vụ</th>
            <th style="min-width: 90px;">Ngày sinh</th>
            <th style="min-width: 60px;">Giới tính</th>
            <th style="min-width: 60px;">Lớp cũ</th>
            <th style="min-width: 120px;">Liên hệ</th>
            <th style="min-width: 55px; text-align: center;">Tổ</th>
            <th style="width: 70px; text-align: center;">Hành động</th>
          </tr>
        </thead>
        <tbody id="hsStudentsTableBody">
          <!-- Rendered by hs.js -->
        </tbody>
      </table>
    </section>

  </main>

  <!-- Modal: Add / Edit Student -->
  <div class="c7-dialog-overlay" id="hsStudentModalOverlay" style="display: none;">
    <div class="c7-dialog-box" style="max-width: 620px; text-align: left;">
      <h3 id="hsModalTitle" style="font-size: 1.25rem; font-weight: 800; margin-bottom: 14px;">➕ Thêm Học Sinh Mới</h3>
      
      <div style="display: flex; flex-direction: column; gap: 14px; max-height: 70vh; overflow-y: auto; padding-right: 6px; margin-bottom: 18px;">
        <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Họ và tên (*)</label>
            <input type="text" id="inputStdName" class="form-control-custom" placeholder="vd: Nguyễn Văn An">
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Ngày sinh (* YYYY-MM-DD)</label>
            <input type="date" id="inputStdDob" class="form-control-custom">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Giới tính</label>
            <select id="selectStdGender" class="form-control-custom">
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
            </select>
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Lớp cũ</label>
            <input type="text" id="inputStdPreviousClass" class="form-control-custom" placeholder="10C7">
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Chức vụ chính</label>
            <select id="selectStdRole" class="form-control-custom">
              <option value="student">👤 Học sinh</option>
              <option value="monitor">⭐️ Lớp trưởng</option>
              <option value="secretary">🔥 Bí thư chi đoàn</option>
              <option value="vice_study">📚 Lớp phó học tập</option>
              <option value="vice_labor">🧹 Lớp phó lao động</option>
              <option value="vice_art">🎭 Lớp phó văn thể mỹ</option>
              <option value="vice_subject">📝 Lớp phó bộ môn</option>
              <option value="treasurer">💰 Thủ quỹ</option>
              <option value="group_leader">👥 Tổ trưởng</option>
            </select>
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Tổ sinh hoạt</label>
            <select id="selectStdGroup" class="form-control-custom">
              <option value="1">Tổ 1</option>
              <option value="2">Tổ 2</option>
              <option value="3">Tổ 3</option>
              <option value="4">Tổ 4</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Số điện thoại</label>
            <input type="tel" id="inputStdPhone" class="form-control-custom" placeholder="090...">
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Email</label>
            <input type="email" id="inputStdEmail" class="form-control-custom" placeholder="email@gmail.com">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Số CCCD / Mã định danh</label>
            <input type="text" id="inputStdCccd" class="form-control-custom" placeholder="12 chữ số...">
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Địa chỉ thường trú</label>
            <input type="text" id="inputStdAddress" class="form-control-custom" placeholder="Số nhà, đường, phường/xã...">
          </div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; gap: 10px;">
        <button class="c7-btn c7-btn-danger" id="btnDeleteStdTrigger" style="display: none;" onclick="deleteStudentAction()">Xóa học sinh</button>
        <div style="display: flex; gap: 8px; margin-left: auto;">
          <button class="c7-btn c7-btn-secondary" onclick="closeStudentModal()">Hủy bỏ</button>
          <button class="c7-btn c7-btn-primary" onclick="submitStudentForm()">Lưu Hồ Sơ</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Lớp 11C7. C7AIO Hub.</p>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Core Scripts -->
  <script src="../script/firebase-config.js?v=3.3.4"></script>
  <script src="../script/firebase-utils.js?v=3.3.4"></script>
  <script src="../script/students-list.js?v=3.3.4"></script>
  <script src="../script/hub.js?v=3.3.4"></script>
  <script src="../script/console.js?v=3.3.4"></script>
  <script src="../script/hs.js?v=3.3.4"></script>
</body>
</html>
