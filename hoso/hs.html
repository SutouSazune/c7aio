<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>11C7 AIO - Quản Lý Hồ Sơ Học Sinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/hub.css">
  <link rel="stylesheet" href="../style/hs.css">
</head>
<body>

  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <a href="../index.html" class="back-btn" title="Về trang chủ">←</a>
        <div class="header-titles">
          <div class="header-title-row">
            <span class="header-icon">👨‍🎓</span>
            <span class="header-title-text">Hồ Sơ Học Sinh</span>
          </div>
          <p>Danh bạ & thông tin chi tiết thành viên lớp 11C7 (Năm học 2026-2027)</p>
        </div>
      </div>
      <div class="header-right">
        <!-- Theme toggle injected by hub.js -->
        <button class="user-badge-btn" onclick="go('index.html')">
          <span id="userNameDisplay">Học sinh</span>
        </button>
      </div>
    </div>
  </header>

  <main class="hs-page-container">

    <!-- Top Action & Search Bar -->
    <section class="hs-top-bar">
      <div class="c7-search-box">
        <span class="c7-search-icon">🔍</span>
        <input type="text" id="hsSearchInput" class="c7-search-input" placeholder="Tìm kiếm theo tên, SĐT, Email, Lớp cũ..." oninput="handleStudentSearch(this.value)">
      </div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="c7-btn c7-btn-secondary" onclick="exportStudentsCsv()">
          📤 Xuất CSV
        </button>
        <button class="c7-btn c7-btn-secondary" onclick="triggerImportCsv()">
          📥 Nhập CSV
        </button>
        <input type="file" id="csvFileInput" accept=".csv, .json" style="display: none;" onchange="handleCsvFile(event)">
        <button class="c7-btn c7-btn-primary" onclick="openAddStudentModal()">
          <span>+</span> Thêm Học Sinh
        </button>
      </div>
    </section>

    <!-- View Controls & Layout Switcher Hub -->
    <section class="hs-view-hub">
      <div class="hs-view-hub-top">
        <!-- Layout Mode Switcher -->
        <div class="hs-mode-group" role="tablist">
          <span class="hs-hub-label">Bố cục:</span>
          <button type="button" class="hs-mode-btn active" data-mode="table_full" onclick="setViewMode('table_full')">
            <span class="hs-btn-icon">📋</span> Bảng đầy đủ
          </button>
          <button type="button" class="hs-mode-btn" data-mode="split_gender" onclick="setViewMode('split_gender')">
            <span class="hs-btn-icon">🚻</span> 2 Cột Nam - Nữ
          </button>
          <button type="button" class="hs-mode-btn" data-mode="split_roles" onclick="setViewMode('split_roles')">
            <span class="hs-btn-icon">🎖️</span> Cán sự - Học sinh
          </button>
          <button type="button" class="hs-mode-btn" data-mode="by_groups" onclick="setViewMode('by_groups')">
            <span class="hs-btn-icon">👥</span> Theo Tổ (1-4)
          </button>
          <button type="button" class="hs-mode-btn" data-mode="by_field" onclick="setViewMode('by_field')">
            <span class="hs-btn-icon">📑</span> Theo thông tin
          </button>
        </div>

        <!-- Required Extra Column Selector (Chỉ hiện tên & cột yêu cầu) -->
        <div class="hs-req-field-container">
          <span class="hs-hub-label">Cột yêu cầu:</span>
          <select id="selectRequiredField" class="hs-select-field" onchange="setRequiredField(this.value)">
            <option value="none">Chỉ hiện tên (Mặc định)</option>
            <option value="dob">🎂 Ngày sinh</option>
            <option value="phone">📞 Số điện thoại</option>
            <option value="email">✉️ Email</option>
            <option value="role">🎖️ Chức vụ / Vai trò</option>
            <option value="previousClass">🏫 Lớp cũ</option>
            <option value="group">🚩 Tổ sinh hoạt</option>
            <option value="gender">🚻 Giới tính</option>
            <option value="cccd">🪪 Số CCCD</option>
            <option value="address">📍 Địa chỉ</option>
            <option value="status">🟢 Trạng thái Online</option>
          </select>
        </div>

        <!-- Utility Buttons -->
        <div class="hs-hub-actions">
          <button type="button" class="c7-btn c7-btn-secondary" onclick="copyCurrentViewText()" title="Sao chép danh sách học sinh theo chế độ xem hiện tại">
            📋 Sao chép danh sách
          </button>
          <button type="button" class="c7-btn c7-btn-secondary" onclick="window.print()" title="In danh sách học sinh theo chế độ xem hiện tại">
            🖨️ In
          </button>
        </div>
      </div>

      <!-- Quick Filter Bar & Live Counters -->
      <div class="hs-view-hub-bottom">
        <div class="hs-filter-chips">
          <span class="hs-hub-label">Lọc đối tượng:</span>
          <button type="button" class="hs-filter-btn active" data-filter="all" onclick="setQuickFilter('all')">Tất cả</button>
          <button type="button" class="hs-filter-btn" data-filter="male" onclick="setQuickFilter('male')">👦 Chỉ Nam</button>
          <button type="button" class="hs-filter-btn" data-filter="female" onclick="setQuickFilter('female')">👧 Chỉ Nữ</button>
          <button type="button" class="hs-filter-btn" data-filter="cadre" onclick="setQuickFilter('cadre')">🎖️ Ban cán sự</button>
          <button type="button" class="hs-filter-btn" data-filter="g1" onclick="setQuickFilter('g1')">Tổ 1</button>
          <button type="button" class="hs-filter-btn" data-filter="g2" onclick="setQuickFilter('g2')">Tổ 2</button>
          <button type="button" class="hs-filter-btn" data-filter="g3" onclick="setQuickFilter('g3')">Tổ 3</button>
          <button type="button" class="hs-filter-btn" data-filter="g4" onclick="setQuickFilter('g4')">Tổ 4</button>
        </div>

        <div id="hsStatsBar" class="hs-stats-bar">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </section>

    <!-- Dynamic Display Area -->
    <section id="hsDisplayCard" class="hs-display-card">
      <div id="hsActiveViewContainer">
        <!-- Rendered dynamically by hs.js based on currentViewMode -->
      </div>
    </section>

  </main>

  <!-- Modal: Add / Edit Student -->
  <div class="c7-dialog-overlay" id="hsStudentModalOverlay" style="display: none;">
    <div class="c7-dialog-box" style="max-width: 620px; text-align: left;">
      <h3 id="hsModalTitle" style="font-size: 1.25rem; font-weight: 800; margin-bottom: 14px;">➕ Thêm Học Sinh Mới</h3>
      
      <div style="display: flex; flex-direction: column; gap: 14px; max-height: 70vh; overflow-y: auto; padding-right: 6px; margin-bottom: 18px;">
        <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Họ và tên (*)</label>
            <input type="text" id="inputStdName" class="form-control-custom" placeholder="vd: Nguyễn Văn An">
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Ngày sinh (* YYYY-MM-DD)</label>
            <input type="date" id="inputStdDob" class="form-control-custom">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Giới tính</label>
            <select id="selectStdGender" class="form-control-custom">
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
            </select>
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Lớp cũ</label>
            <input type="text" id="inputStdPreviousClass" class="form-control-custom" placeholder="10C7">
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Tổ sinh hoạt</label>
            <select id="selectStdGroup" class="form-control-custom">
              <option value="1">Tổ 1</option>
              <option value="2">Tổ 2</option>
              <option value="3">Tổ 3</option>
              <option value="4">Tổ 4</option>
            </select>
          </div>
        </div>

        <div>
          <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; display: block;">Chức vụ / Vai trò đảm nhiệm (Có thể chọn nhiều)</label>
          <div id="rolesCheckboxContainer" style="display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 1px solid var(--input-border); border-radius: var(--radius-sm); background: var(--bg-surface); max-height: 140px; overflow-y: auto;">
            <!-- Rendered dynamically by hs.js -->
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Số điện thoại</label>
            <input type="tel" id="inputStdPhone" class="form-control-custom" placeholder="090...">
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Email</label>
            <input type="email" id="inputStdEmail" class="form-control-custom" placeholder="email@gmail.com">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Số CCCD / Mã định danh</label>
            <input type="text" id="inputStdCccd" class="form-control-custom" placeholder="12 chữ số...">
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--text-sub);">Địa chỉ thường trú</label>
            <input type="text" id="inputStdAddress" class="form-control-custom" placeholder="Số nhà, đường, phường/xã...">
          </div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; gap: 10px;">
        <button class="c7-btn c7-btn-danger" id="btnDeleteStdTrigger" style="display: none;" onclick="deleteStudentAction()">Xóa học sinh</button>
        <div style="display: flex; gap: 8px; margin-left: auto;">
          <button class="c7-btn c7-btn-secondary" onclick="closeStudentModal()">Hủy bỏ</button>
          <button class="c7-btn c7-btn-primary" onclick="submitStudentForm()">Lưu Hồ Sơ</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Lớp 11C7. C7AIO Hub.</p>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Core Scripts -->
  <script src="../script/firebase-config.js"></script>
  <script src="../script/firebase-utils.js"></script>
  <script src="../script/students-list.js"></script>
  <script src="../script/hub.js"></script>
  <script src="../script/console.js"></script>
  <script src="../script/hs.js"></script>
</body>
</html>
