<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>Sơ Đồ Lớp — 11C7</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='60' font-size='80' text-anchor='middle'>🪑</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/hub.css?v=3.5.1">
  <link rel="stylesheet" href="../style/sodo.css?v=3.5.1">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <a href="../index.html" class="header-back-link" title="Về trang chủ"
          style="display:flex;align-items:center;text-decoration:none;color:inherit;margin-right:8px;padding:6px 12px;border-radius:8px;transition:background 0.15s ease;font-weight:600;font-size:.875rem;"
          onmouseover="this.style.background='rgba(99,102,241,0.1)'"
          onmouseout="this.style.background='transparent'">
          ← Trang Chủ
        </a>
        <span class="header-logo-badge">🪑</span>
        <div class="header-titles">
          <div class="header-title-row">
            <span class="header-title-text">Sơ Đồ Lớp 11C7</span>
          </div>
          <p>Vị trí ngồi trong lớp, ngoài sân & mọi hoạt động</p>
        </div>
      </div>
      <div class="header-right">
        <button class="user-badge-btn" onclick="handleProfileClick()" title="Thông tin cá nhân">
          <div class="user-avatar-mini" id="userAvatarMini" style="background:linear-gradient(135deg,#6366f1,#a855f7)">HS</div>
          <span id="userNameDisplay">Học sinh</span>
        </button>
        <button class="btn-logout" onclick="handleLogout()" title="Đăng xuất">Đăng xuất</button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="welcome-hero" style="padding-bottom:0">
    <div class="welcome-text">
      <h2>🪑 Sơ Đồ Lớp &amp; Sân Trường 11C7</h2>
      <p>Xem &amp; quản lý vị trí ngồi trong lớp, theo môn học, ngoài sân trường và mọi hoạt động</p>
    </div>
  </section>

  <!-- Tabs -->
  <div class="sodo-tabs">
    <button class="sodo-tab-btn active" data-tab="tronglop" onclick="switchTab('tronglop')">
      <span class="sodo-tab-icon">🏫</span><span>Trong Lớp</span>
    </button>
    <button class="sodo-tab-btn" data-tab="subject" onclick="switchTab('subject')">
      <span class="sodo-tab-icon">📚</span><span>Theo Môn</span>
    </button>
    <button class="sodo-tab-btn" data-tab="ngoaisan" onclick="switchTab('ngoaisan')">
      <span class="sodo-tab-icon">🏟️</span><span>Ngoài Sân</span>
    </button>
    <button class="sodo-tab-btn" data-tab="tuychinh" onclick="switchTab('tuychinh')">
      <span class="sodo-tab-icon">🎨</span><span>Tùy Chỉnh</span>
    </button>
  </div>

  <!-- Panels -->
  <div class="sodo-panels">
    <div class="sodo-tab-panel active" data-tab="tronglop"  id="panel-tronglop">
      <div class="sodo-loading">⏳ Đang tải sơ đồ lớp...</div>
    </div>
    <div class="sodo-tab-panel" data-tab="subject"   id="panel-subject">
      <div class="sodo-loading">⏳ Đang tải...</div>
    </div>
    <div class="sodo-tab-panel" data-tab="ngoaisan"  id="panel-ngoaisan">
      <div class="sodo-loading">⏳ Đang tải...</div>
    </div>
    <div class="sodo-tab-panel" data-tab="tuychinh"  id="panel-tuychinh">
      <div class="sodo-loading">⏳ Đang tải...</div>
    </div>
  </div>

  <!-- Editor / View Overlay -->
  <div id="sodo-editor-overlay" class="sodo-editor-overlay"></div>

  <footer class="footer">
    <p>&copy; 2026 Tập thể Lớp 11C7 &mdash; C7AIO</p>
  </footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="../script/firebase-config.js?v=3.5.1"></script>
  <script src="../script/firebase-utils.js?v=3.5.1"></script>
  <script src="../script/students-list.js?v=3.5.1"></script>
  <script src="../script/hub.js?v=3.5.1"></script>
  <script src="../script/console.js?v=3.5.1"></script>
  <script src="../script/sodo.js?v=3.5.1"></script>

  <script>
    function handleLogout() {
      showConfirm('Đăng xuất', 'Bạn có chắc chắn muốn đăng xuất?', () => {
        logoutUser();
        window.location.href = buildUrl('../login.html');
      });
    }
    function handleProfileClick() {
      const user = getCurrentUser();
      if (!user) return;
      const roles = Array.isArray(user.role) ? user.role : [user.role || 'student'];
      const roleText = roles.map(r => ROLES[r] || r).join(', ');
      showDialog('Hồ sơ', `👤 ${user.name}<br>⭐ ${roleText}<br>📅 ${user.dob || 'Chưa cập nhật'}`, '👤');
    }
  </script>
</body>
</html>
