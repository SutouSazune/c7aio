<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>10C7 AIO - Phân Quyền Hệ Thống</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/hub.css">
  <link rel="stylesheet" href="../style/pq.css">
</head>
<body>

  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <a href="../index.html" class="back-btn" title="Về trang chủ">←</a>
        <div class="header-titles">
          <div class="header-title-row">
            <span class="header-icon">⚙️</span>
            <span class="header-title-text">Phân Quyền Chức Vụ</span>
          </div>
          <p>Điều hành quyền hạn và chức năng cho các ban cán sự</p>
        </div>
      </div>
      <div class="header-right">
        <!-- Theme toggle injected by hub.js -->
        <button class="user-badge-btn" onclick="go('index.html')">
          <span id="userNameDisplay">Học sinh</span>
        </button>
      </div>
    </div>
  </header>

  <main class="pq-page-container">

    <section class="pq-top-header">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 800;">Ma Trận Quyền Hạn (Role Matrix)</h2>
        <p style="font-size: 0.85rem; color: var(--text-sub);">Tích chọn các quyền mà từng chức vụ được phép thực hiện</p>
      </div>
      <button class="c7-btn c7-btn-primary" onclick="saveRolesConfig()">
        💾 Lưu Cấu Hình Phân Quyền
      </button>
    </section>

    <section class="pq-table-card">
      <div class="roles-matrix-container" id="rolesMatrixContainer">
        <!-- Rendered by pq.js -->
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>&copy; 2026 Lớp 10C7. C7AIO Hub.</p>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Core Scripts -->
  <script src="../script/firebase-config.js"></script>
  <script src="../script/firebase-utils.js"></script>
  <script src="../script/students-list.js"></script>
  <script src="../script/hub.js"></script>
  <script src="../script/console.js"></script>
  <script src="../script/pq.js"></script>
</body>
</html>
