<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0ea5a0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#04070f" media="(prefers-color-scheme: dark)">
  <title>11C7 AIO - Đăng Nhập Hệ Thống</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/tokens.css?v=6.0.0">
  <link rel="stylesheet" href="style/hub.css?v=6.0.0">
  <link rel="stylesheet" href="style/login.css?v=6.0.0">
  <!-- Clean style loaded from style/login.css -->








</head>
<body class="login-page-body">
  <!-- Ambient Background Canvas System -->
  <div class="c7-bg-canvas" aria-hidden="true">
    <div class="c7-orb c7-orb--1"></div>
    <div class="c7-orb c7-orb--2"></div>
    <div class="c7-orb c7-orb--3"></div>
  </div>

  <div class="login-box">
    <!-- Header / Brand -->
    <div class="login-brand">
      <div class="login-brand-icon">📚</div>
      <h1>11C7 All In One</h1>
      <p>Cổng thông tin & quản lý học tập lớp học</p>
    </div>

    <!-- Student Selection Flow -->
    <div id="studentSelectionFlow">
      <div class="search-student-wrapper">
        <span class="search-icon-pos">🔍</span>
        <input type="text" id="searchStudentInput" class="search-student-input" placeholder="Tìm tên học sinh trong lớp..." oninput="filterStudents(this.value)">
      </div>

      <div class="student-select-grid" id="studentSelectGrid">
        <!-- Rendered by JavaScript -->
      </div>
    </div>

    <!-- Verification Card (DOB check) -->
    <div class="verify-card" id="studentVerifyCard">
      <div class="verify-header">
        <div class="verify-avatar" id="verifyAvatar">HS</div>
        <div class="verify-title">
          <h3 id="verifyName">Họ và tên</h3>
          <p>Xác nhận ngày sinh để đăng nhập</p>
        </div>
      </div>

      <div class="form-group-custom">
        <label for="inputStudentDob">Ngày sinh (Ngày / Tháng / Năm):</label>
        <input type="date" id="inputStudentDob" class="form-control-custom">
      </div>

      <div class="btn-group-row">
        <button class="c7-btn c7-btn-secondary" onclick="cancelStudentVerify()">← Quay lại</button>
        <button class="c7-btn c7-btn-primary" onclick="confirmStudentLogin()">Đăng nhập →</button>
      </div>
    </div>

    <!-- Admin Login Card -->
    <div class="verify-card" id="adminLoginCard">
      <div class="verify-header">
        <div class="verify-avatar" style="background: linear-gradient(135deg, #ef4444, #f59e0b);">⚡</div>
        <div class="verify-title">
          <h3>Quản trị viên (Admin)</h3>
          <p>Nhập mã bảo mật để truy cập bảng điều khiển</p>
        </div>
      </div>

      <div class="form-group-custom">
        <label for="inputAdminCode">Mã bảo mật Admin:</label>
        <input type="password" id="inputAdminCode" class="form-control-custom" placeholder="Nhập mã admin...">
      </div>

      <div class="btn-group-row">
        <button class="c7-btn c7-btn-secondary" onclick="cancelAdminLogin()">← Quay lại</button>
        <button class="c7-btn c7-btn-primary" onclick="confirmAdminLogin()">Đăng nhập Admin</button>
      </div>
    </div>

    <!-- Admin Panel Toggle & Guest Mode -->
    <div class="admin-toggle-panel" id="adminTogglePanel">
      <button class="btn-admin-mode" onclick="openAdminLogin()">
        <span>👨‍💼 Đăng nhập với quyền Quản trị viên</span>
      </button>
      <button class="btn-guest-mode" onclick="guestLogin()" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(6, 182, 212, 0.12)); border: 1px solid rgba(16, 185, 129, 0.35); color: #10b981; padding: 10px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.25s var(--ease-spring);">
        <span>🚀 Khám phá nhanh (Chế độ Trải nghiệm Khách)</span>
      </button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Core Scripts -->
  <script src="script/firebase-config.js"></script>
  <script src="script/firebase-utils.js"></script>
  <script src="script/students-list.js"></script>
  <script src="script/hub.js"></script>
  <script src="script/console.js"></script>

  <script>
    let selectedStudent = null;

    window.addEventListener('load', () => {
      // Nếu đã đăng nhập, chuyển hướng thẳng vào Hub
      if (isLoggedIn()) {
        window.location.href = buildUrl('index.html');
        return;
      }

      renderStudentGrid(STUDENTS);

      // Đồng bộ danh sách học sinh từ Firebase
      if (typeof onSharedStudentsChanged === 'function') {
        onSharedStudentsChanged((data) => {
          if (data && data.length > 0) {
            STUDENTS = data;
            renderStudentGrid(STUDENTS);
          }
        });
      }
    });

    function renderStudentGrid(list) {
      const grid = document.getElementById('studentSelectGrid');
      if (!grid) return;

      if (!list || list.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 20px; color: var(--text-muted);">Đang tải danh sách học sinh...</div>';
        return;
      }

      grid.innerHTML = list.map(student => `
        <button class="student-card-btn" onclick="selectStudentForLogin(${student.id})">
          <div class="student-bubble-avatar" style="background: ${getAvatarGradient(student.name)}">
            ${getInitials(student.name)}
          </div>
          <span class="student-card-name">${escapeHtml(student.name)}</span>
        </button>
      `).join('');
    }

    function filterStudents(query) {
      const q = (query || '').toLowerCase().trim();
      const filtered = STUDENTS.filter(s => 
        s.name.toLowerCase().includes(q) || 
        (s.phone && s.phone.includes(q))
      );
      renderStudentGrid(filtered);
    }

    function selectStudentForLogin(studentId) {
      selectedStudent = STUDENTS.find(s => s.id === studentId);
      if (!selectedStudent) return;

      document.getElementById('studentSelectionFlow').style.display = 'none';
      document.getElementById('adminTogglePanel').style.display = 'none';
      
      const verifyCard = document.getElementById('studentVerifyCard');
      document.getElementById('verifyName').textContent = selectedStudent.name;
      const avatarEl = document.getElementById('verifyAvatar');
      avatarEl.textContent = getInitials(selectedStudent.name);
      avatarEl.style.background = getAvatarGradient(selectedStudent.name);
      
      const dobInput = document.getElementById('inputStudentDob');
      dobInput.value = '';
      verifyCard.classList.add('active');
      dobInput.focus();
    }

    function cancelStudentVerify() {
      selectedStudent = null;
      document.getElementById('studentVerifyCard').classList.remove('active');
      document.getElementById('studentSelectionFlow').style.display = 'block';
      document.getElementById('adminTogglePanel').style.display = 'flex';
    }

    function confirmStudentLogin() {
      if (!selectedStudent) return;
      const dob = document.getElementById('inputStudentDob').value;
      if (!dob) {
        showToast('Vui lòng chọn ngày sinh để xác thực!', 'warning');
        return;
      }

      const user = loginUser(selectedStudent.name, dob);
      if (user) {
        showToast(`🎉 Xin chào, ${user.name}!`, 'success');
        setTimeout(() => {
          window.location.href = buildUrl('index.html');
        }, 500);
      } else {
        showToast('Ngày sinh không chính xác. Vui lòng thử lại!', 'error');
      }
    }

    function openAdminLogin() {
      document.getElementById('studentSelectionFlow').style.display = 'none';
      document.getElementById('adminTogglePanel').style.display = 'none';
      document.getElementById('adminLoginCard').classList.add('active');
      document.getElementById('inputAdminCode').value = '';
      document.getElementById('inputAdminCode').focus();
    }

    function cancelAdminLogin() {
      document.getElementById('adminLoginCard').classList.remove('active');
      document.getElementById('studentSelectionFlow').style.display = 'block';
      document.getElementById('adminTogglePanel').style.display = 'flex';
    }

    function confirmAdminLogin() {
      const code = document.getElementById('inputAdminCode').value.trim();
      if (!code) {
        showToast('Vui lòng nhập mã bảo mật Admin!', 'warning');
        return;
      }

      const user = loginUser('admin', code);
      if (user) {
        showToast('🔓 Đăng nhập quyền Admin thành công!', 'success');
        setTimeout(() => {
          window.location.href = buildUrl('index.html');
        }, 500);
      } else {
        showToast('Mã bảo mật Admin không đúng!', 'error');
        document.getElementById('inputAdminCode').value = '';
      }
    }

    function guestLogin() {
      const guest = { id: 999, name: 'Khách Tham Quan', role: 'student', class: '11C7' };
      localStorage.setItem('c7aio_currentUser', JSON.stringify(guest));
      localStorage.setItem('c7aio_loginTime', new Date().toISOString());
      showToast('👋 Chào mừng bạn đến với C7AIO Hub!', 'info');
      setTimeout(() => {
        window.location.href = buildUrl('index.html');
      }, 400);
    }

    // Keyboard support (Enter key)
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('studentVerifyCard').classList.contains('active')) {
          confirmStudentLogin();
        } else if (document.getElementById('adminLoginCard').classList.contains('active')) {
          confirmAdminLogin();
        }
      }
    });
  </script>
</body>
</html>
