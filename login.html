<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>10C7 AIO - Đăng Nhập Hệ Thống</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/hub.css?v=3.3.3">
  <link rel="stylesheet" href="style/login.css?v=3.3.3">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <span class="login-badge-icon">🔐</span>
      <h2>C7AIO Portal</h2>
      <p>Cổng Thông Tin & Quản Lý Lớp Học 10C7</p>
    </div>

    <!-- Mode Selector Tab -->
    <div class="login-tabs">
      <button class="login-tab active" id="tabStudent" onclick="switchLoginMode('student')">👨‍🎓 Học Sinh</button>
      <button class="login-tab" id="tabAdmin" onclick="switchLoginMode('admin')">👑 Quản Trị Viên</button>
    </div>

    <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="login-form">
      
      <!-- Student View -->
      <div id="studentFieldsWrap">
        <div class="form-group">
          <label for="studentNameSelect">Chọn Họ và Tên</label>
          <select id="studentNameSelect" class="form-control-custom">
            <option value="">-- Chọn tên học sinh 10C7 --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="studentSecretInput">Mật khẩu (Ngày sinh YYYY-MM-DD hoặc DD/MM/YYYY)</label>
          <input type="password" id="studentSecretInput" class="form-control-custom" placeholder="vd: 2010-02-14 hoặc 14022010">
        </div>
      </div>

      <!-- Admin View -->
      <div id="adminFieldsWrap" style="display: none;">
        <div class="form-group">
          <label for="adminUsernameInput">Tài khoản Quản trị</label>
          <input type="text" id="adminUsernameInput" class="form-control-custom" value="Admin" placeholder="Nhập admin...">
        </div>
        <div class="form-group">
          <label for="adminPasswordInput">Mật khẩu Admin</label>
          <input type="password" id="adminPasswordInput" class="form-control-custom" placeholder="Nhập mã truy cập...">
        </div>
      </div>

      <div class="login-action-btn-wrap">
        <button type="submit" class="c7-btn c7-btn-primary btn-block" id="btnLoginSubmit">
          Đăng Nhập Hệ Thống →
        </button>
      </div>

    </form>

    <div class="login-footer-hint">
      <span>💡 Gợi ý: Học sinh sử dụng ngày sinh (YYYY-MM-DD) để đăng nhập bảo mật.</span>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Scripts -->
  <script src="script/firebase-config.js?v=3.3.3"></script>
  <script src="script/firebase-utils.js?v=3.3.3"></script>
  <script src="script/students-list.js?v=3.3.3"></script>
  <script src="script/hub.js?v=3.3.3"></script>
  <script src="script/console.js?v=3.3.3"></script>
  <script src="script/login.js?v=3.3.3"></script>
</body>
</html>
