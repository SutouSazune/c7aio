  <title>10C7 AIO - Nhật Ký Hoạt Động</title>

  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <a href="../index.html" class="back-btn" title="Về trang chủ">←</a>
        <div class="header-titles">
          <div class="header-title-row">
            <span class="header-icon">📜</span>
            <span class="header-title-text">Nhật Ký Hoạt Động</span>
          </div>
          <p>Lịch sử các thao tác & cập nhật của lớp</p>
        </div>
      </div>
      <div class="header-right">
        <!-- Theme toggle injected by hub.js -->
        <button class="user-badge-btn" onclick="go('index.html')">
          <span id="userNameDisplay">Học sinh</span>
        </button>
      </div>
    </div>
  </header>

  <main class="nk-page-container">

    <!-- Top Action Bar -->
    <section class="nk-top-bar">
      <div>
        <h3 style="font-weight: 800; font-size: 1.15rem;">Dòng Sự Kiện Hệ Thống (Audit Logs)</h3>
        <p style="color: var(--text-sub); font-size: 0.85rem;">Ghi nhận mọi thao tác phân công, sửa đổi lịch học và thông báo</p>
      </div>
      <div>
        <button class="c7-btn c7-btn-danger" id="btnClearLogsBtn" onclick="clearAllLogsAction()">
          🗑️ Xóa Nhật Ký
        </button>
      </div>
    </section>

    <!-- Logs Timeline Card -->
    <section class="nk-card-container">
      <div class="nk-timeline" id="logsTimelineContainer">
        <!-- Rendered by nk.js -->
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>&copy; 2026 Lớp 10C7. C7AIO Hub.</p>
  </footer>
