<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0ea5a0">
  <title>11C7 AIO - Lỗi 500</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='60' font-size='80' text-anchor='middle'>⚠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/tokens.css?v=6.2.0">
  <link rel="stylesheet" href="style/hub.css?v=6.2.0">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1.5rem;
    }
    .error-container {
      background: var(--bg-elevated);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-xl);
      padding: 3rem 2rem;
      max-width: 560px;
      width: 100%;
      box-shadow: var(--sh-xl);
      text-align: center;
    }
    .error-icon { font-size: 4.5rem; margin-bottom: 0.5rem; }
    .error-code {
      font-size: 3.5rem;
      font-weight: 800;
      background: var(--c7-gradient-danger);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-primary); }
    .error-message { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6; }
    .error-details {
      background: var(--bg-surface);
      border-left: 4px solid var(--danger);
      padding: 1.25rem;
      border-radius: var(--r-md);
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .error-details p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; font-family: var(--font-mono); }
    .error-details strong { color: var(--text-primary); }
    .action-buttons { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn { padding: 0.65rem 1.4rem; border-radius: var(--r-md); font-weight: 700; cursor: pointer; border: 1px solid var(--border-subtle); font-family: inherit; }
    .btn-primary { background: var(--c7-gradient-primary); color: #fff; border: none; }
    .btn-secondary { background: var(--bg-surface); color: var(--text-primary); }
    .footer-text { font-size: 0.82rem; color: var(--text-muted); margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon">⚠️</div>
    <div class="error-code">500</div>
    <h1 class="error-title">Lỗi Server Nội Bộ</h1>
    <p class="error-message">Rất tiếc, máy chủ gặp lỗi không mong muốn. Hệ thống sẽ sớm được khắc phục.</p>
    <div class="error-details">
      <p><strong>Lỗi:</strong> HTTP 500 Internal Server Error</p>
      <p><strong>Trạng thái:</strong> Đang được xử lý</p>
      <p><strong>Thời gian:</strong> <span id="currentTime"></span></p>
    </div>
    <div class="action-buttons">
      <button class="btn btn-primary" onclick="window.location.href='./index.html'">🏠 Về Trang Chủ</button>
      <button class="btn btn-secondary" onclick="window.location.reload()">🔄 Tải Lại</button>
    </div>
    <p class="footer-text">Nếu lỗi này tiếp tục xảy ra, vui lòng liên hệ với quản trị viên.</p>
  </div>
  <script>
    document.getElementById('currentTime').textContent = new Date().toLocaleString('vi-VN');
  </script>
</body>
</html>
