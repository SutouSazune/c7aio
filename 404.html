<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0ea5a0">
  <title>11C7 AIO - Lỗi 404</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='60' font-size='80' text-anchor='middle'>❌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/tokens.css?v=12.0.0">
  <link rel="stylesheet" href="style/hub.css?v=12.0.0">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1.5rem;
    }
    .error-card {
      background: var(--spatial-card-bg);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--spatial-border);
      border-radius: var(--r-xl);
      padding: 3rem 2rem;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--spatial-shadow), 0 1px 0 var(--spatial-inset-top) inset;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .error-icon {
      font-size: 4.5rem;
      margin-bottom: 0.5rem;
    }
    .error-code {
      font-size: 3.5rem;
      font-weight: 800;
      background: var(--c7-gradient-warm);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="c7-bg-canvas" aria-hidden="true">
    <div class="c7-orb c7-orb--1"></div>
    <div class="c7-orb c7-orb--2"></div>
    <div class="c7-orb c7-orb--3"></div>
  </div>
  <div class="error-card">
    <div class="error-icon">🔍</div>
    <div class="error-code">404</div>
    <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 6px;">Không Tìm Thấy Trang</h2>
    <p style="color: var(--text-sub); font-size: 0.95rem; margin-bottom: 24px;">Trang bạn yêu cầu không tồn tại hoặc đã được chuyển sang đường dẫn khác.</p>
    <div style="display: flex; gap: 10px; justify-content: center;">
      <a href="./index.html" class="c7-btn c7-btn-primary" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">🏠 Về Trang Chủ</a>
      <button class="c7-btn c7-btn-secondary" onclick="window.history.back()">↩️ Quay lại</button>
    </div>
  </div>
</body>
</html>
